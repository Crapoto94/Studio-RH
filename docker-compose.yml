services:
  rhstudio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rhstudio-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5010}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - rhstudio_data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  rhstudio_data:
    driver: local
